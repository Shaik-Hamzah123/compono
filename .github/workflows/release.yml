name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read  # listing any permission here zeroes the rest by default —
                       # actions/checkout needs this explicitly or it can't see
                       # the (private) repo at all.
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish
