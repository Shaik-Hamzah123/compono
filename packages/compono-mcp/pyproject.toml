[project]
name = "compono-mcp"
version = "0.1.3"
description = "MCP server exposing compono's render_deck/validate/review/inspire_scan/docx as MCP tools."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Shaik-Hamzah123", email = "hamzah.shaik2003@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "compono>=0.2.0",
    "fastmcp>=4.0.3",
]

[project.scripts]
compono-mcp = "compono_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
compono = { workspace = true }
