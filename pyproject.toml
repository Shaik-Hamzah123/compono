[project]
name = "compono"
version = "0.2.0"
description = "Agent-oriented, code-based PPTX/DOCX generation library — typed primitives, no raw coordinates."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Shaik-Hamzah123", email = "hamzah.shaik2003@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.65.0",
    "matplotlib>=3.11.2",
    "pydantic>=2.13.5",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
compono = "compono.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]
# compono-js and compono-js-mcp are TypeScript/npm packages (their own
# package.json), not uv workspace members — exclude them explicitly since
# uv's glob otherwise errors on a packages/* directory with no
# pyproject.toml.
exclude = ["packages/compono-js", "packages/compono-js-mcp"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "types-pyyaml>=6.0.12.20260906",
]
